<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستشار التسويق الذكي | AI Marketing Advisor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 15px; }
        .btn-custom { background: linear-gradient(135deg, #6366f1, #a855f7); color: white; border: none; font-weight: bold; }
        .btn-custom:hover { opacity: 0.9; color: white; }
        .output-box { background-color: #0f172a; border-radius: 10px; padding: 20px; white-space: pre-line; border: 1px solid #334155; }
    </style>
</head>
<body class="py-5">
    <div class="container">
        <div class="text-center mb-5">
            <h1 class="fw-bold text-transparent bg-clip-text">🚀 مستشار التسويق الذكي (AI Advisor)</h1>
            <p class="text-muted">أدخل تفاصيل منتجك واحصل على خطة تسويقية نصوص إعلانية جاهزة في ثوانٍ!</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card p-4 shadow-lg mb-4">
                    <div class="mb-3">
                        <label class="form-label">اسم المنتج أو الخدمة:</label>
                        <input type="text" id="product_name" class="form-control bg-dark text-white border-secondary" placeholder="مثلاً: سماعات بلوتوث رياضية">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الجمهور المستهدف (اختياري):</label>
                        <input type="text" id="target_audience" class="form-control bg-dark text-white border-secondary" placeholder="مثلاً: الشباب ومحبي الرياضة في الجزائر">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">الميزانية (اختياري):</label>
                        <input type="text" id="budget" class="form-control bg-dark text-white border-secondary" placeholder="مثلاً: ميزانية بسيطة / إعلانات ممولة">
                    </div>
                    <button onclick="generatePlan()" class="btn btn-custom btn-lg w-100 mt-2">✨ إنشاء الخطة التسويقية</button>
                </div>

                <div id="loading" class="text-center d-none my-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2 text-info">جاري تحليل السوق واستخراج الخطة بواسطة الذكاء الاصطناعي...</p>
                </div>

                <div id="result-card" class="card p-4 shadow-lg d-none">
                    <h3 class="h5 text-warning mb-3">📋 الخطة التسويقية المقترحة:</h3>
                    <div id="output" class="output-box"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        async function generatePlan() {
            const productName = document.getElementById('product_name').value;
            if(!productName) { alert('يرجى كتابة اسم المنتج أولاً!'); return; }

            document.getElementById('loading').classList.remove('d-none');
            document.getElementById('result-card').classList.add('d-none');

            const response = await fetch('/generate_plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    product_name: productName,
                    target_audience: document.getElementById('target_audience').value,
                    budget: document.getElementById('budget').value
                })
            });

            const data = await response.json();
            document.getElementById('loading').classList.add('d-none');

            if(data.success) {
                document.getElementById('output').innerText = data.plan;
                document.getElementById('result-card').classList.remove('d-none');
            } else {
                alert('حدث خطأ: ' + data.error);
            }
        }
    </script>
</body>
</html>
